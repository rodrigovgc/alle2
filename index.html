<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F6F4EC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alle" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Your Flashcard Decks | Alle</title>
    <meta name="description" content="Open Alle to create and study your flashcard decks, track your progress and practise the cards that need more work." />
    <!-- The app, login and signup don't belong in search results -->
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Login / signup links (?auth=…) get their own title and description straight away.
      (function () {
        var a = new URLSearchParams(location.search).get('auth');
        var m = a === 'signup'
          ? ['Create Your Alle Account', 'Create a free Alle account and start learning with your own flashcard decks or choose a ready-made deck to get started.']
          : (a === 'login' || a === 'signin')
            ? ['Log in to Alle', 'Log in to Alle to access your flashcard decks, continue studying and pick up where you left off.']
            : null;
        if (m) {
          document.title = m[0];
          var d = document.querySelector('meta[name="description"]');
          if (d) d.setAttribute('content', m[1]);
        }
      })();
    </script>
    <script>
      // Apply the saved appearance before anything paints, so there's no flash.
      try {
        var p = localStorage.getItem('alle-theme') || 'light';
        var d = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
